name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare CI results
        run: mkdir -p ci-results
      - name: Prepare package lock
        run: npm install --package-lock-only --ignore-scripts > ci-results/01-package-lock.log 2>&1
      - name: Install dependencies
        run: npm ci > ci-results/02-npm-ci.log 2>&1
      - name: Check file lines
        run: npm run check:file-lines > ci-results/03-check-file-lines.log 2>&1
      - name: Check runtime
        run: npm run check:runtime > ci-results/04-check-runtime.log 2>&1
      - name: Generate Prisma client
        run: npm run db:generate > ci-results/05-db-generate.log 2>&1
      - name: Typecheck
        run: npm run typecheck > ci-results/06-typecheck.log 2>&1
      - name: Unit tests
        run: npm run test:unit > ci-results/07-test-unit.log 2>&1
      - name: Functional tests
        run: npm run test:functional > ci-results/08-test-functional.log 2>&1
      - name: API tests
        run: npm run test:api > ci-results/09-test-api.log 2>&1
      - name: Nonbrowser tests
        run: npm run test:nonbrowser > ci-results/10-test-nonbrowser.log 2>&1
      - name: E2E contract tests
        run: npm run test:e2e > ci-results/11-test-e2e.log 2>&1
      - name: Full-suite summary
        run: npm run test:all > ci-results/12-test-all.log 2>&1
      - name: Coverage summary
        run: npm run test:coverage > ci-results/13-test-coverage.log 2>&1
      - name: Build
        run: npm run build > ci-results/14-build.log 2>&1
      - name: Route smoke
        run: npm run smoke:routes:local > ci-results/15-smoke-routes-local.log 2>&1
      - name: Upload CI command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-command-logs
          path: ci-results
          if-no-files-found: ignore
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage
          if-no-files-found: ignore
# CI trigger marker: doc guard verification
