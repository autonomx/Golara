name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check:file-lines
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run smoke:routes:local
